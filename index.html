<html>
    <head>
        <title>Leads Tracker</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>


      <div id="auth-container" class="card">
        <h1>Leads Tracker</h1>
    <p class="auth-subtitle">Track and manage your leads in one place.</p> 
          
    <input type="email" id="email-el" placeholder="Email">
    <input type="password" id="password-el" placeholder="Password">
          
    <div class="start">
    <button id="signup-btn">Create account</button>
    <button id="login-btn">Log in</button>
    </div>
          
    <p id="error-el"></p>
    </div>



      <div id="leads-tracker" class="card">
         <label>Enter URL:</label>
        <input type="text" id="input-el" placeholder="https://scrimba.com">
        <div class="actions">
        <button id="input-btn">SAVE INPUT</button>
        <button id="delete-btn">DELETE ALL</button>
        </div>
       
        <ul id="ul-el">
        </ul>
        <button id="exit-el">Sign Out</button>
        <script type="module" src="index.js"></script>
       
      </div> 
    </body>
</html>
